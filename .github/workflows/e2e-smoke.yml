name: E2E Smoke Test

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8am UTC
  workflow_dispatch:

jobs:
  e2e-test:
    name: E2E Create App Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Whop auth
        run: |
          mkdir -p ~/.whoplabs
          echo '${{ secrets.WHOP_SESSION_JSON }}' > ~/.whoplabs/whop-session.json

      - name: Create test app (non-interactive mode)
        id: create-app
        run: |
          # Set CI environment to skip interactive prompts where possible
          export CI=true
          
          # Try to create a test project
          # Note: create-whop-app requires interactive input, so we test the build and help
          node dist/index.js --help
          
          echo "CLI loads successfully"

      - name: Verify build output
        run: |
          test -f dist/index.js
          echo "Build output exists"

      - name: Notify on failure
        uses: ./.github/actions/telegram-notify
        if: failure()
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ job.status }}
          workflow: "create-whop-app E2E"

